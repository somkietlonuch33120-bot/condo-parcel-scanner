
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบถ่ายภาพและสแกนพัสดุ</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: #f5f3f9;
  color: #302b3d;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

h2 {
  text-align: center;
  color: #7051a5;
  margin: 4px 0 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
  margin-bottom: 18px;
}

.status {
  background: #f1edf8;
  color: #7051a5;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
  font-size: 14px;
  margin-bottom: 15px;
  line-height: 1.5;
}

.camera-area {
  width: 100%;
  min-height: 260px;
  background: #171717;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

#reader {
  width: 100%;
  display: none;
  background: #000;
}

#reader video {
  width: 100% !important;
  border-radius: 12px;
}

#photoVideo {
  display: none;
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  background: #000;
}

.camera-placeholder {
  color: #fff;
  text-align: center;
  padding: 25px;
  line-height: 1.7;
  font-size: 14px;
}

.buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .15s;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.btn-photo {
  background: #7051a5;
  color: #fff;
}

.btn-scan {
  background: #16865b;
  color: #fff;
}

.btn-stop {
  background: #e9e9e9;
  color: #333;
}

button:active:not(:disabled) {
  transform: scale(.98);
}

.result {
  margin-top: 15px;
  padding: 13px;
  border: 1px solid #e5e0ed;
  border-radius: 10px;
  display: none;
  overflow-wrap: anywhere;
}

.result-label {
  color: #777;
  font-size: 13px;
  margin-bottom: 5px;
}

.tracking {
  font-size: 19px;
  font-weight: bold;
  color: #16865b;
}

.photo-info {
  font-size: 13px;
  color: #666;
  text-align: center;
  margin-top: 12px;
  line-height: 1.6;
}

#downloadLink {
  display: none;
}

@media(max-width: 480px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 14px;
  }

  .camera-area {
    min-height: 230px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h2>ระบบถ่ายภาพและสแกนพัสดุ</h2>
  <div class="subtitle">ระบบจัดการพัสดุคอนโด</div>

  <div id="status" class="status">
    กรุณาเลือกโหมดการใช้งาน
  </div>

  <div class="camera-area">

    <div id="cameraPlaceholder" class="camera-placeholder">
      <div style="font-size:42px;">📷</div>
      กรุณากดปุ่มกล้องถ่ายรูปหรือกล้องสแกน
    </div>

    <video
      id="photoVideo"
      autoplay
      playsinline
      muted>
    </video>

    <div id="reader"></div>

  </div>

  <!-- ปุ่มเรียงตามที่กำหนด -->
  <div class="buttons">
  
    <button
      id="photoButton"
      class="btn-photo"
      type="button">
      📷 กล้องถ่ายรูป
    </button>
  
    <button
      id="scanButton"
      class="btn-scan"
      type="button"
      onclick="startScanner()">
      🔍 กล้องสแกน
    </button>
  
    <button
      id="stopButton"
      class="btn-stop"
      type="button"
      onclick="stopAllCameras()">
      ⏹ ปิดกล้อง
    </button>
  
  </div>

  <div id="result" class="result">
    <div class="result-label">เลข Tracking ที่อ่านได้</div>
    <div id="trackingValue" class="tracking"></div>
  </div>

  <div id="photoInfo" class="photo-info">
    เมื่อถ่ายภาพแล้ว ระบบจะดาวน์โหลดรูปภาพลงอุปกรณ์
    และยังสามารถถ่ายภาพต่อได้โดยไม่ต้องเปิดหน้าใหม่
  </div>

  <a id="downloadLink"></a>

</div>

<canvas id="photoCanvas" style="display:none;"></canvas>

<script>
/* =========================================
   CONFIGURATION
========================================= */

let scanner = null;
let photoStream = null;

let running = false;
let starting = false;
let paused = false;

let parentOrigin = null;
let currentMode = "none";
let modeRequestId = 0;
let scanSent = false;

const statusEl = document.getElementById("status");
const readerEl = document.getElementById("reader");
const photoVideo = document.getElementById("photoVideo");
const placeholder = document.getElementById("cameraPlaceholder");

const photoButton = document.getElementById("photoButton");
const scanButton = document.getElementById("scanButton");
const stopButton = document.getElementById("stopButton");

const resultEl = document.getElementById("result");
const trackingValueEl = document.getElementById("trackingValue");
const photoInfoEl = document.getElementById("photoInfo");


/* =========================================
   STATUS
========================================= */

function setStatus(message) {
  statusEl.textContent = message;
}

function setButtonsDisabled(disabled) {
  photoButton.disabled = disabled;
  scanButton.disabled = disabled;
  stopButton.disabled = disabled;
}

function showPlaceholder() {
  placeholder.style.display = "block";
  readerEl.style.display = "none";
  photoVideo.style.display = "none";
}

function hidePlaceholder() {
  placeholder.style.display = "none";
}


/* =========================================
   PARENT WINDOW COMMUNICATION
========================================= */

/* =========================================
   PARENT WINDOW COMMUNICATION - FIX
========================================= */

function isAllowedParentOrigin(origin) {
  try {
    const url = new URL(origin);
    const host = url.hostname;

    if (url.protocol !== "https:") return false;

    return (
      host === "script.google.com" ||
      host === "script.googleusercontent.com" ||
      host.endsWith("-script.googleusercontent.com") ||
      host.endsWith(".script.googleusercontent.com")
    );

  } catch (e) {
    return false;
  }
}

function notifyParentReady() {
  if (!window.opener || window.opener.closed) return;

  window.opener.postMessage({
    type: "SCANNER_READY"
  }, "*");
}

function sendToParent(data) {

  if (!window.opener || window.opener.closed) {
    setStatus("ไม่พบหน้าต่างระบบหลัก กรุณาเปิด Scanner จากหน้ารับพัสดุ");
    return false;
  }

  if (!parentOrigin) {
    setStatus("กำลังเชื่อมต่อกับหน้าระบบหลัก กรุณาลองใหม่");
    return false;
  }

  try {
    window.opener.postMessage(data, parentOrigin);
    return true;
  } catch (error) {
    console.error("ส่งข้อมูลกลับหน้าหลักไม่สำเร็จ:", error);
    setStatus("ส่ง Tracking กลับหน้าหลักไม่สำเร็จ");
    return false;
  }
}

window.addEventListener("message", function(event) {

  if (event.source !== window.opener) return;

  if (event.data?.type === "PARENT_INIT") {

    if (!isAllowedParentOrigin(event.origin)) {
      console.warn("Parent origin ไม่ได้รับอนุญาต:", event.origin);
      return;
    }

    parentOrigin = event.origin;

    console.log("เชื่อมต่อหน้าหลักสำเร็จ:", parentOrigin);

    setStatus("เชื่อมต่อหน้าระบบหลักแล้ว พร้อมใช้งาน");

    // ไม่ส่ง SCANNER_READY ซ้ำตรงนี้ เพื่อป้องกันการวนข้อความ
    return;
  }

  if (!parentOrigin || event.origin !== parentOrigin) return;

  if (event.data?.type === "NEXT_SCAN") {

    if (currentMode === "scan" && scanner && paused) {
      try {
        scanner.resume();
        paused = false;
        scanSent = false;
        setStatus("พร้อมสแกน Tracking รายการถัดไป");
      } catch (e) {
        startScanner();
      }
    } else {
      startScanner();
    }
  }

});

/* =========================================
   STOP PHOTO CAMERA
========================================= */

function stopPhotoCamera() {

  if (photoStream) {

    photoStream.getTracks().forEach(track => {
      try {
        track.stop();
      } catch (e) {}
    });

    photoStream = null;
  }

  photoVideo.pause();
  photoVideo.srcObject = null;
  photoVideo.style.display = "none";
}


/* =========================================
   STOP QR / BARCODE SCANNER
========================================= */

async function stopScanner() {

  if (!scanner) {
    running = false;
    starting = false;
    paused = false;
    readerEl.style.display = "none";
    return;
  }

  const oldScanner = scanner;

  scanner = null;
  running = false;
  starting = false;
  paused = false;

  try {
    if (oldScanner.isScanning) {
      await oldScanner.stop();
    }
  } catch (e) {
    console.warn("Scanner stop:", e);
  }

  try {
    oldScanner.clear();
  } catch (e) {
    console.warn("Scanner clear:", e);
  }

  readerEl.innerHTML = "";
  readerEl.style.display = "none";
}


/* =========================================
   STOP ALL CAMERAS
========================================= */

async function stopAllCameras() {

  modeRequestId++;

  setButtonsDisabled(true);
  setStatus("กำลังปิดกล้อง...");

  stopPhotoCamera();
  await stopScanner();

  currentMode = "none";
  scanSent = false;

  showPlaceholder();

  resultEl.style.display = "none";
  photoButton.textContent = "📷 กล้องถ่ายรูป";
  setButtonsDisabled(false);
  setStatus("ปิดกล้องเรียบร้อยแล้ว");
}


/* =========================================
   PHOTO CAMERA
========================================= */

async function startPhotoCamera() {

  const requestId = ++modeRequestId;

  setButtonsDisabled(true);
  setStatus("กำลังเปิดกล้องถ่ายรูป...");

  // ปิดกล้องสแกนก่อน
  stopPhotoCamera();
  await stopScanner();

  if (requestId !== modeRequestId) return;

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    setStatus("อุปกรณ์หรือเบราว์เซอร์ไม่รองรับการเปิดกล้อง");
    setButtonsDisabled(false);
    return;
  }

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    // หากมีการกดเปลี่ยนโหมดระหว่างรอเปิดกล้อง
    if (requestId !== modeRequestId) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    photoStream = stream;
    currentMode = "photo";

    photoVideo.srcObject = stream;
    photoVideo.style.display = "block";

    readerEl.style.display = "none";
    hidePlaceholder();

    await photoVideo.play();

    setStatus("เปิดกล้องถ่ายรูปแล้ว สามารถกดถ่ายภาพได้");
    photoButton.textContent = "📸 ถ่ายภาพ";
    photoInfoEl.textContent =
      "กำลังใช้โหมดถ่ายภาพพัสดุ สามารถถ่ายภาพได้หลายครั้ง";

  } catch (error) {

    console.error(error);

    if (requestId === modeRequestId) {

      currentMode = "none";
      stopPhotoCamera();
      showPlaceholder();

      if (error.name === "NotAllowedError") {
        setStatus("ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาตรวจสอบสิทธิ์กล้อง");
      } else if (error.name === "NotFoundError") {
        setStatus("ไม่พบกล้องบนอุปกรณ์");
      } else {
        setStatus("เปิดกล้องไม่สำเร็จ: " + error.message);
      }
    }

  } finally {

    if (requestId === modeRequestId) {
      setButtonsDisabled(false);
    }
  }
}


/* =========================================
   CAPTURE PHOTO
========================================= */

function capturePhoto() {

  if (currentMode !== "photo" ||
      !photoStream ||
      !photoVideo.videoWidth) {

    setStatus("กรุณาเปิดกล้องถ่ายรูปก่อน");
    return;
  }

  const canvas = document.getElementById("photoCanvas");
  const context = canvas.getContext("2d");

  canvas.width = photoVideo.videoWidth;
  canvas.height = photoVideo.videoHeight;

  context.drawImage(
    photoVideo,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob(function(blob) {

    if (!blob) {
      setStatus("ไม่สามารถบันทึกภาพได้ กรุณาลองอีกครั้ง");
      return;
    }

    const now = new Date();

    const date =
      now.getFullYear() +
      String(now.getMonth() + 1).padStart(2, "0") +
      String(now.getDate()).padStart(2, "0");

    const time =
      String(now.getHours()).padStart(2, "0") +
      String(now.getMinutes()).padStart(2, "0") +
      String(now.getSeconds()).padStart(2, "0");

    const fileName = "Parcel_" + date + "_" + time + ".jpg";

    const url = URL.createObjectURL(blob);

    const link = document.getElementById("downloadLink");

    link.href = url;
    link.download = fileName;

    // สั่งดาวน์โหลดภาพ
    link.click();

    setStatus("ถ่ายภาพเรียบร้อยแล้ว กำลังบันทึกภาพลงอุปกรณ์");

    photoInfoEl.textContent =
      "บันทึกภาพ " + fileName +
      " แล้ว สามารถถ่ายภาพต่อได้";

    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 60000);

  }, "image/jpeg", 0.92);
}


/* =========================================
   PHOTO CAPTURE BUTTON
   ใช้ปุ่มกล้องถ่ายรูป:
   - ครั้งแรกเปิดกล้อง
   - เมื่อเปิดกล้องแล้ว กดอีกครั้งเพื่อถ่ายภาพ
========================================= */

photoButton.onclick = async function() {

  // ถ้ายังไม่ได้เปิดกล้อง ให้เปิดกล้องก่อน
  if (currentMode !== "photo" || !photoStream) {
    await startPhotoCamera();
    return;
  }

  // ถ้าเปิดกล้องอยู่ ให้ถ่ายภาพ
  capturePhoto();
};


/* =========================================
   QR / BARCODE SCANNER
========================================= */

async function startScanner() {

  const requestId = ++modeRequestId;

  setButtonsDisabled(true);
  setStatus("กำลังเตรียมกล้องสแกน...");

  // ปิดกล้องถ่ายรูปก่อน
  stopPhotoCamera();
  await stopScanner();

  if (requestId !== modeRequestId) return;

  if (typeof Html5Qrcode === "undefined") {
    setStatus("โหลดระบบสแกนไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต");
    setButtonsDisabled(false);
    return;
  }

  currentMode = "scan";
  scanSent = false;

  readerEl.innerHTML = "";
  readerEl.style.display = "block";
  hidePlaceholder();

  const formats = [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.CODE_93,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF
  ];

  const newScanner = new Html5Qrcode("reader", {
    formatsToSupport: formats,
    verbose: false
  });

  scanner = newScanner;
  starting = true;

  try {

    await newScanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: function(viewWidth, viewHeight) {

          const width = Math.min(280, viewWidth * 0.85);
          const height = Math.min(160, viewHeight * 0.55);

          return {
            width: Math.floor(width),
            height: Math.floor(height)
          };
        }
      },

      function(decodedText) {
        onScanSuccess(decodedText);
      },

      function(errorMessage) {
        // ไม่แสดงข้อความ error ระหว่างค้นหา Barcode
      }
    );

    if (requestId !== modeRequestId) {
      try {
        await newScanner.stop();
        newScanner.clear();
      } catch (e) {}

      return;
    }

    running = true;
    starting = false;
    paused = false;

    setStatus("เปิดกล้องสแกนแล้ว กรุณานำ QR / Barcode ให้อยู่ในกรอบ");

  } catch (error) {

    console.error(error);

    if (scanner === newScanner) {
      scanner = null;
    }

    try {
      if (newScanner.isScanning) {
        await newScanner.stop();
      }
      newScanner.clear();
    } catch (e) {}

    if (requestId === modeRequestId) {

      running = false;
      starting = false;
      currentMode = "none";

      showPlaceholder();

      if (error.name === "NotAllowedError") {
        setStatus("ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาตรวจสอบสิทธิ์กล้อง");
      } else {
        setStatus("เปิดกล้องสแกนไม่สำเร็จ: " + error);
      }
    }

  } finally {

    if (requestId === modeRequestId) {
      setButtonsDisabled(false);
    }
  }
}


/* =========================================
   SCAN SUCCESS
========================================= */


function onScanSuccess(decodedText) {

  if (scanSent || currentMode !== "scan") return;

  const tracking = String(decodedText || "").trim();

  if (!tracking) return;

  if (!window.opener || window.opener.closed) {
    setStatus("ไม่พบหน้าต่างระบบหลัก ไม่สามารถส่ง Tracking ได้");
    return;
  }

  if (!parentOrigin) {
    setStatus("ยังไม่ได้เชื่อมต่อหน้าหลัก กรุณารอสักครู่แล้วสแกนใหม่");
    return;
  }

  scanSent = true;
  paused = true;

  try {
    if (scanner && scanner.isScanning) {
      scanner.pause(true);
    }
  } catch (e) {
    console.warn(e);
  }

  trackingValueEl.textContent = tracking;
  resultEl.style.display = "block";

  setStatus("กำลังส่ง Tracking กลับหน้ากรอกพัสดุ...");

  const sent = sendToParent({
    type: "TRACKING_SCANNED",
    tracking: tracking
  });

  if (!sent) {
    scanSent = false;
    paused = false;

    try {
      if (scanner && scanner.isScanning) {
        scanner.resume();
      }
    } catch (e) {}

    return;
  }

  setStatus("ส่ง Tracking สำเร็จ กำลังกลับหน้ากรอกพัสดุ");

  setTimeout(function() {
    window.close();
  }, 700);
}


/* =========================================
   PAGE INITIALIZATION
========================================= */

window.addEventListener("load", function() {

  showPlaceholder();

  setStatus("พร้อมใช้งาน กรุณาเลือกโหมดกล้อง");

  notifyParentReady();

  // แจ้งหน้าหลักอีกครั้ง เผื่อหน้าหลักยังไม่พร้อมรับข้อความ
  setTimeout(notifyParentReady, 500);
  setTimeout(notifyParentReady, 1200);

});


/* =========================================
   CLEANUP WHEN PAGE CLOSES
========================================= */

window.addEventListener("beforeunload", function() {

  if (photoStream) {
    photoStream.getTracks().forEach(track => {
      try {
        track.stop();
      } catch (e) {}
    });
  }

  if (scanner && scanner.isScanning) {
    scanner.stop().catch(function() {});
  }

});
</script>

</body>
</html>
